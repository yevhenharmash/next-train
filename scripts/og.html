<!doctype html>
<!--
  Source for public/og.png, the link preview image. With `pnpm dev` running:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --force-device-scale-factor=1 --virtual-time-budget=5000 \
    --screenshot="$PWD/public/og.png" http://localhost:5173/scripts/og.html
  Keep the PNG under ~300 KB: WhatsApp drops larger preview images.
-->

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0d10;
        color: #f4f5f2;
        font-family: Geist, system-ui, sans-serif;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 80px;
      }
      .left {
        flex: 1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin-top: 44px;
        font-size: 64px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      p {
        margin-top: 24px;
        font-size: 28px;
        line-height: 1.35;
        color: #a9afb7;
      }
      .card {
        flex-shrink: 0;
        width: 460px;
        background: #1d2127;
        border: 1px solid #323840;
        border-radius: 28px;
        padding: 36px;
      }
      .label {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a9afb7;
      }
      .leave {
        margin-top: 10px;
        white-space: nowrap;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #ffb81c;
      }
      .sub {
        margin-top: 6px;
        font-size: 20px;
        color: #a9afb7;
      }
      .times {
        display: flex;
        justify-content: space-between;
        margin-top: 32px;
        padding-top: 28px;
        border-top: 1px solid #323840;
      }
      .times div div:first-child {
        font-size: 16px;
        color: #a9afb7;
      }
      .times div div:last-child {
        margin-top: 6px;
        font-size: 34px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .ok {
        display: inline-block;
        margin-top: 28px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(134, 217, 166, 0.14);
        color: #86d9a6;
        font-size: 18px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="brand"><img src="/favicon.svg" alt="" />Traincommute</div>
      <h1>When to leave for your train</h1>
      <p>Next trains between any two UK stations, sorted by when they arrive.</p>
    </div>
    <div class="card">
      <div class="label">Next to Euston</div>
      <div class="leave">Leave in 8 min</div>
      <div class="sub">Leave by 22:38 · 10 min walk</div>
      <div class="times">
        <div>
          <div>Departs</div>
          <div>22:46</div>
        </div>
        <div>
          <div>Platform</div>
          <div>1</div>
        </div>
        <div>
          <div>Arrives</div>
          <div>23:26</div>
        </div>
      </div>
      <span class="ok">On time</span>
    </div>
  </body>
</html>
