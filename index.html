<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="The next trains between any two UK stations, sorted by when they arrive, with when to leave."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f2" />
    <script>
      // Apply the saved theme before first paint, so dark mode doesn't flash white. Mirrors src/ui/theme.ts.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("next-train:theme");
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0b0d10" : "#f3f4f2");
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Traincommute</title>
    <meta name="apple-mobile-web-app-title" content="Traincommute" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
